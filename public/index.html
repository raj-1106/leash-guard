<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leash Guard</title>
<style>
  body{font:16px system-ui;max-width:42rem;margin:2rem auto;padding:0 1rem;background:#fff;color:#111}
  textarea{width:100%;height:7rem;font:12px monospace}
  button{margin:.25rem .25rem .25rem 0;padding:.4rem .7rem}
  .allow{color:#0a7a2f}.warn{color:#b26a00}.block{color:#c00}
  li{margin:.3rem 0}
</style>
<h1>Leash Guard</h1>
<p>Paste a base64 Solana transaction before you sign it, or try a sample.</p>
<div id="samples"></div>
<textarea id="tx" placeholder="base64 serialized transaction"></textarea><br>
<button id="go">Screen transaction</button>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
fetch('/samples').then(r=>r.json()).then(s=>{
  for(const [name,tx] of Object.entries(s)){
    const b=document.createElement('button');b.textContent=name;
    b.onclick=()=>{$('tx').value=tx;go()};$('samples').append(b);
  }
});
async function go(){
  const r=await fetch('/screen',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({transaction:$('tx').value.trim()})});
  const j=await r.json();
  const o=$('out');o.textContent='';
  if(j.error){o.textContent=j.error;return}
  const h=document.createElement('h2');h.className=j.verdict;h.textContent=j.verdict.toUpperCase();
  const p=document.createElement('p');p.textContent=j.explanation;
  const ul=document.createElement('ul');
  for(const f of j.findings){const li=document.createElement('li');li.textContent=`[${f.code}] ${f.detail}`;ul.append(li)}
  o.append(h,p,ul);
}
$('go').onclick=go;
</script>
